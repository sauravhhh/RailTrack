<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RailTrack</title>
<meta name="description" content="Minimal live train tracker for Indian Railways.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --txt:#111; --mut:#8e8e93;
    --acc:#0a58d6; --sep:#e5e5ea; --inp:#e9e9ee; --green:#1a9e4b; --red:#d93025; --amber:#b7791f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000; --card:#1c1c1e; --txt:#f2f2f7; --mut:#98989f;
      --acc:#4d9fff; --sep:#38383a; --inp:#2c2c2e; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--txt);}
  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
  header{padding:calc(14px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;gap:10px;}
  header h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.3px;}
  #apiDot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex-shrink:0;}
  #apiDot.ok{background:var(--green);} #apiDot.bad{background:var(--red);}
  #apiTxt{font-size:12px;color:var(--mut);}
  #dbBar{text-align:center;font-size:12px;color:var(--mut);padding:2px 0 6px;display:block;}
  #dbBar.ok{display:none;}
  main{flex:1;padding:4px 14px 90px;}
  .view{display:none;} .view.on{display:block;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;}}
  .field{margin:10px 0;position:relative;}
  .field label{display:block;font-size:13px;color:var(--mut);margin:0 2px 6px;}
  .field input{width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--sep);
    border-radius:12px;background:var(--card);color:var(--txt);outline:none;}
  .field input:focus{border-color:var(--acc);}
  .sugg{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--sep);
    border-radius:12px;margin-top:4px;z-index:20;max-height:240px;overflow:auto;
    box-shadow:0 8px 24px rgba(0,0,0,.12);display:none;}
  .sugg.on{display:block;}
  .sugg div{padding:11px 14px;font-size:15px;cursor:pointer;border-bottom:1px solid var(--sep);}
  .sugg div:last-child{border-bottom:none;}
  .sugg div:active{background:var(--inp);}
  .sugg small{color:var(--mut);font-size:12px;margin-left:6px;}
  .btn{width:100%;padding:14px;font-size:16px;font-weight:600;border:none;border-radius:12px;
    background:var(--acc);color:#fff;cursor:pointer;margin-top:6px;}
  .btn:active{opacity:.85;}
  .btn:disabled{opacity:.5;}
  .card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;
    box-shadow:0 1px 4px rgba(0,0,0,.07);}
  .card h3{margin:0 0 2px;font-size:17px;}
  .card .sub{color:var(--mut);font-size:13px;margin:0 0 10px;}
  .pill{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;}
  .pill.ok{background:rgba(26,158,75,.14);color:var(--green);}
  .pill.late{background:rgba(217,48,37,.12);color:var(--red);}
  .pill.info{background:rgba(10,88,214,.12);color:var(--acc);}
  .big{font-size:30px;font-weight:700;margin:8px 0 2px;letter-spacing:-.5px;}
  .row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--sep);font-size:14px;}
  .row:first-of-type{border-top:none;}
  .row .k{color:var(--mut);}
  .tl{margin:6px 0 0;padding:0;list-style:none;}
  .tl li{position:relative;padding:0 0 16px 22px;font-size:14px;}
  .tl li::before{content:"";position:absolute;left:6px;top:6px;width:8px;height:8px;border-radius:50%;
    background:var(--acc);}
  .tl li::after{content:"";position:absolute;left:9px;top:16px;bottom:-2px;width:2px;background:var(--sep);}
  .tl li:last-child::after{display:none;}
  .tl li.done::before{background:var(--green);}
  .tl .t{color:var(--mut);font-size:12px;}
  .err{background:rgba(217,48,37,.08);border:1px solid rgba(217,48,37,.25);color:var(--red);
    border-radius:12px;padding:14px;font-size:14px;margin:12px 0;}
  .spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--sep);
    border-top-color:var(--acc);animation:sp .8s linear infinite;margin:26px auto;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .trainline{display:flex;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--sep);}
  .trainline:first-of-type{border-top:none;}
  .trainline .n{font-weight:700;font-size:15px;}
  .trainline .t{font-size:13px;color:var(--mut);}
  .trainline .times{margin-left:auto;text-align:right;font-size:13px;}
  .trainline .times b{font-size:15px;}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:rgba(249,249,249,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--sep);padding-bottom:env(safe-area-inset-bottom);}
  @media (prefers-color-scheme: dark){ nav{background:rgba(20,20,22,.9);} }
  nav .in{max-width:560px;margin:0 auto;display:flex;}
  nav button{flex:1;background:none;border:none;padding:10px 4px 8px;font-size:11px;color:var(--mut);
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
  nav button .ic{font-size:20px;}
  nav button.on{color:var(--acc);}
  .foot{text-align:center;color:var(--mut);font-size:11px;padding:18px 0 6px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>RailTrack</h1>
    <span id="apiDot"></span><span id="apiTxt">checking…</span>
  </header>
  <div id="dbBar">Loading offline database…</div>
  <main>
    <!-- LIVE -->
    <section class="view on" id="v-live">
      <div class="field">
        <label>Train number or name</label>
        <input id="liveQ" placeholder="e.g. 12301 or Rajdhani" autocomplete="off">
        <div class="sugg" id="liveSugg"></div>
      </div>
      <button class="btn" id="liveBtn">Track live status</button>
      <div id="liveOut"></div>
    </section>
    <!-- PNR -->
    <section class="view" id="v-pnr">
      <div class="field">
        <label>10-digit PNR number</label>
        <input id="pnrQ" inputmode="numeric" maxlength="10" placeholder="e.g. 1234567890" autocomplete="off">
      </div>
      <button class="btn" id="pnrBtn">Check PNR status</button>
      <div id="pnrOut"></div>
    </section>
    <!-- TRAINS BETWEEN -->
    <section class="view" id="v-trains">
      <div class="field">
        <label>From station</label>
        <input id="fromQ" placeholder="e.g. NDLS or New Delhi" autocomplete="off">
        <div class="sugg" id="fromSugg"></div>
      </div>
      <div class="field">
        <label>To station</label>
        <input id="toQ" placeholder="e.g. HWH or Howrah" autocomplete="off">
        <div class="sugg" id="toSugg"></div>
      </div>
      <div class="field">
        <label>Date</label>
        <input id="dateQ" type="date">
      </div>
      <button class="btn" id="trainsBtn">Find trains</button>
      <div id="trainsOut"></div>
    </section>
    <!-- SCHEDULE -->
    <section class="view" id="v-sched">
      <div class="field">
        <label>Train number or name</label>
        <input id="schedQ" placeholder="e.g. 12301 or Rajdhani" autocomplete="off">
        <div class="sugg" id="schedSugg"></div>
      </div>
      <button class="btn" id="schedBtn">Show schedule</button>
      <div id="schedOut"></div>
    </section>
    <div class="foot">Trains &amp; schedules work fully offline · Live status &amp; PNR need the API</div>
  </main>
</div>
<nav><div class="in">
  <button data-v="v-live" class="on"><span class="ic">📍</span>Live</button>
  <button data-v="v-pnr"><span class="ic">🎫</span>PNR</button>
  <button data-v="v-trains"><span class="ic">🚂</span>Trains</button>
  <button data-v="v-sched"><span class="ic">🗓</span>Schedule</button>
</div></nav>
<script>
const API = 'https://indian-railway-api.onrender.com';
let TRAINS = [], STATIONS = [], STN = {}, DBOK = false;
const $ = id => document.getElementById(id);

/* ---------- tabs ---------- */
document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
    $(''+b.dataset.v).classList.add('on');
  });
});

/* ---------- local database ---------- */
async function loadDB(){
  try{
    const [t, s] = await Promise.all([
      fetch('data/trains.min.json').then(r=>r.json()),
      fetch('data/stations.min.json').then(r=>r.json())
    ]);
    TRAINS = t; STATIONS = s; DBOK = true;
    STN = {}; s.forEach(x=>{ STN[x[0]] = x[1]; });
    $('dbBar').className = 'ok';
  }catch(e){ DBOK = false; $('dbBar').textContent = 'Offline database failed to load.'; }
}
/* ---------- offline route helpers ---------- */
/* t[5] = ";CODE,depMin,arrMin,day;..." (minutes since midnight, "" = none) */
function parseRoute(t){
  return t[5].split(';').slice(1).map(p=>{
    const c = p.split(',');
    return {code:c[0], dep:c[1]===''||c[1]==null?null:+c[1], arr:c[2]===''||c[2]==null?null:+c[2], day:+c[3]||1};
  });
}
function fmtM(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function offlineBetween(from, to, date){
  const day = new Date(date+'T12:00:00').getDay(); // 0 = Sunday
  const fTag = ';'+from+',', tTag = ';'+to+',';
  const res = [];
  for(const t of TRAINS){
    if(!t[4] || t[4][day] !== '1') continue;
    const r = t[5];
    const fi = r.indexOf(fTag);
    if(fi < 0) continue;
    if(r.indexOf(tTag, fi + 1) < 0) continue;
    res.push(t);
  }
  return res;
}
function stopInfo(t, code){
  const stops = parseRoute(t);
  for(const s of stops) if(s.code === code) return s;
  return null;
}
function durStr(d1, m1, d2, m2){
  let m = (d2-d1)*1440 + (m2-m1);
  if(m < 0) m += 1440;
  return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function bindTrainSuggest(inputId, suggId){
  const inp = $(inputId), box = $(suggId);
  inp.addEventListener('input', ()=>{
    const q = inp.value.trim().toLowerCase();
    if(!DBOK || q.length < 2){ box.classList.remove('on'); return; }
    const out = [];
    for(const t of TRAINS){
      if(t[0].startsWith(q) || t[1].toLowerCase().includes(q)){
        out.push(t); if(out.length >= 8) break;
      }
    }
    if(!out.length){ box.classList.remove('on'); return; }
    box.innerHTML = out.map(t=>
      '<div data-n="'+esc(t[0])+'"><b>'+esc(t[0])+'</b> '+esc(t[1])+
      '<small>'+esc(t[2]||'')+' → '+esc(t[3]||'')+'</small></div>').join('');
    box.classList.add('on');
    box.querySelectorAll('div').forEach(d=>{
      d.addEventListener('mousedown', e=>{ e.preventDefault(); inp.value = d.dataset.n; inp.dataset.num = d.dataset.n; box.classList.remove('on'); });
    });
  });
  inp.addEventListener('blur', ()=>setTimeout(()=>box.classList.remove('on'), 150));
}
function bindStationSuggest(inputId, suggId){
  const inp = $(inputId), box = $(suggId);
  inp.addEventListener('input', ()=>{
    const q = inp.value.trim().toLowerCase();
    if(!DBOK || q.length < 2){ box.classList.remove('on'); return; }
    const out = [];
    for(const s of STATIONS){
      if(s[0].toLowerCase().startsWith(q) || s[1].toLowerCase().includes(q)){
        out.push(s); if(out.length >= 8) break;
      }
    }
    if(!out.length){ box.classList.remove('on'); return; }
    box.innerHTML = out.map(s=>
      '<div data-c="'+esc(s[0])+'"><b>'+esc(s[0])+'</b> '+esc(s[1])+'</div>').join('');
    box.classList.add('on');
    box.querySelectorAll('div').forEach(d=>{
      d.addEventListener('mousedown', e=>{ e.preventDefault(); inp.value = d.dataset.c+' — '+d.textContent.slice(d.dataset.c.length+1).trim(); inp.dataset.code = d.dataset.c; box.classList.remove('on'); });
    });
  });
  inp.addEventListener('blur', ()=>setTimeout(()=>box.classList.remove('on'), 150));
}
function stationCode(inp){
  if(inp.dataset.code) return inp.dataset.code;
  const m = inp.value.trim().toUpperCase().match(/^[A-Z]{3,5}$/);
  return m ? m[0] : inp.value.trim().toUpperCase().split(' ')[0];
}
function trainNum(inp){
  if(inp.dataset.num) return inp.dataset.num;
  const m = inp.value.trim().match(/\d{4,5}/);
  return m ? m[0] : inp.value.trim();
}

/* ---------- api ---------- */
async function api(path){
  const ctl = new AbortController();
  const to = setTimeout(()=>ctl.abort(), 25000);
  try{
    const r = await fetch(API + path, {signal: ctl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if(!j.success) throw new Error('API error');
    return j.data;
  }finally{ clearTimeout(to); }
}
function apiErr(out){
  $(out).innerHTML = '<div class="err">Couldn\'t reach the live data server right now. Your offline train &amp; station directory still works — try again in a bit.</div>';
}
function loading(out){ $(out).innerHTML = '<div class="spin"></div>'; }
function pill(status, delay){
  if(status === 'DELAYED') return '<span class="pill late">Delayed '+(delay||'')+' min</span>';
  if(status === 'ON_TIME' || status === 'ONTIME') return '<span class="pill ok">On time</span>';
  return '<span class="pill info">'+esc(status||'—')+'</span>';
}

/* ---------- live status ---------- */
$('liveBtn').addEventListener('click', async ()=>{
  const num = trainNum($('liveQ'));
  if(!/^\d{4,5}$/.test(num)){ $('liveOut').innerHTML = '<div class="err">Enter a valid train number.</div>'; return; }
  loading('liveOut');
  try{
    const d = await api('/api/train/'+num+'/live');
    let route = '';
    if(d.stations && d.stations.length){
      route = '<ul class="tl">' + d.stations.slice(0, 40).map(s=>
        '<li><b>'+esc(s.stationCode)+'</b> '+esc(s.stationName)+
        '<div class="t">Arr '+(esc(s.arrivalTime)||'—')+' · Dep '+(esc(s.departureTime)||'—')+(s.platform?' · Pf '+esc(s.platform):'')+'</div></li>'
      ).join('') + '</ul>';
      if(d.stations.length > 40) route += '<div class="sub">+ '+(d.stations.length-40)+' more stops</div>';
    }
    $('liveOut').innerHTML =
      '<div class="card"><h3>'+esc(d.trainName)+'</h3><p class="sub">'+esc(d.trainNumber)+' · '+esc(d.trainType||'')+'</p>'+
      pill(d.status, d.delay)+
      '<div class="big">'+esc(d.currentStation||'—')+'</div><p class="sub">Current station</p>'+
      '<div class="row"><span class="k">Next station</span><span>'+esc(d.nextStation||'—')+'</span></div>'+
      '<div class="row"><span class="k">From → To</span><span>'+esc(d.source||'')+' → '+esc(d.destination||'')+'</span></div>'+
      '<div class="row"><span class="k">Scheduled</span><span>'+esc(d.scheduledDeparture||'')+' → '+esc(d.scheduledArrival||'')+'</span></div>'+
      '</div>'+
      (route ? '<div class="card"><h3>Route</h3>'+route+'</div>' : '');
  }catch(e){ apiErr('liveOut'); }
});

/* ---------- pnr ---------- */
$('pnrBtn').addEventListener('click', async ()=>{
  const pnr = $('pnrQ').value.trim();
  if(!/^\d{10}$/.test(pnr)){ $('pnrOut').innerHTML = '<div class="err">PNR must be 10 digits.</div>'; return; }
  loading('pnrOut');
  try{
    const d = await api('/api/pnr/'+pnr);
    const pax = (d.passengers||[]).map(p=>
      '<div class="row"><span class="k">Passenger '+p.passengerNumber+'</span><span><b>'+esc(p.currentStatus||p.bookingStatus||'')+'</b>'+
      (p.coach ? ' · '+esc(p.coach)+'-'+esc(p.berth||'')+(p.berthCode?' ('+esc(p.berthCode)+')':'') : '')+'</span></div>'
    ).join('');
    $('pnrOut').innerHTML =
      '<div class="card"><h3>PNR '+esc(d.pnrNumber)+'</h3>'+
      '<p class="sub">'+esc(d.trainName||'')+' ('+esc(d.trainNumber||'')+') · '+esc(d.journeyDate||'')+'</p>'+
      '<div class="row"><span class="k">From → To</span><span>'+esc(d.fromStation||'')+' → '+esc(d.toStation||'')+'</span></div>'+
      '<div class="row"><span class="k">Class / Quota</span><span>'+esc(d.class||'')+' / '+esc(d.quota||'')+'</span></div>'+
      '<div class="row"><span class="k">Chart</span><span>'+esc(d.chartStatus||'—')+'</span></div>'+ pax +
      (d.totalFare ? '<div class="row"><span class="k">Fare</span><span>₹'+esc(d.totalFare)+'</span></div>' : '') +
      '</div>';
  }catch(e){ apiErr('pnrOut'); }
});

/* ---------- trains between stations (OFFLINE) ---------- */
$('trainsBtn').addEventListener('click', ()=>{
  const from = stationCode($('fromQ')), to = stationCode($('toQ'));
  if(from.length < 3 || to.length < 3){ $('trainsOut').innerHTML = '<div class="err">Pick valid stations from the suggestions.</div>'; return; }
  if(!DBOK){ $('trainsOut').innerHTML = '<div class="spin"></div>'; return; }
  const date = $('dateQ').value || new Date().toISOString().slice(0,10);
  const list = offlineBetween(from, to, date);
  if(!list.length){ $('trainsOut').innerHTML = '<div class="err">No trains found between '+esc(from)+' and '+esc(to)+' on this date (offline timetable).</div>'; return; }
  const rows = [];
  for(const t of list){
    const a = stopInfo(t, from), b = stopInfo(t, to);
    if(!a || !b) continue;
    const dep = a.dep != null ? a.dep : a.arr;
    const arr = b.arr != null ? b.arr : b.dep;
    if(dep == null || arr == null) continue;
    rows.push({t, dep, arr, dur: durStr(a.day, dep, b.day, arr)});
  }
  rows.sort((x,y)=>x.dep - y.dep);
  if(!rows.length){ $('trainsOut').innerHTML = '<div class="err">No trains with timings found for this route.</div>'; return; }
  $('trainsOut').innerHTML = '<div class="card"><p class="sub" style="margin-top:0">'+rows.length+' trains · offline timetable · '+
    esc(new Date(date+'T12:00:00').toDateString())+'</p>' + rows.map(r=>
    '<div class="trainline"><div><div class="n">'+esc(r.t[0])+'</div><div class="t">'+esc(r.t[1])+'</div>'+
    '<div class="t">'+esc(r.t[2])+' → '+esc(r.t[3])+'</div></div>'+
    '<div class="times"><b>'+fmtM(r.dep)+'</b> → <b>'+fmtM(r.arr)+'</b><div class="t">'+r.dur+'</div></div></div>'
  ).join('') + '</div>';
});

/* ---------- schedule (OFFLINE) ---------- */
$('schedBtn').addEventListener('click', ()=>{
  const num = trainNum($('schedQ'));
  if(!/^\d{4,5}$/.test(num)){ $('schedOut').innerHTML = '<div class="err">Enter a valid train number.</div>'; return; }
  if(!DBOK){ $('schedOut').innerHTML = '<div class="spin"></div>'; return; }
  const t = TRAINS.find(x=>x[0] === num);
  if(!t){ $('schedOut').innerHTML = '<div class="err">Train not in the offline database.</div>'; return; }
  const stops = parseRoute(t);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const runs = t[4] ? t[4].split('').map((v,i)=>v==='1'?days[i]:null).filter(Boolean).join(', ') : '';
  const route = stops.map((s,i)=>
    '<li class="'+(i===0?'done':'')+'"><b>'+esc(s.code)+'</b> '+esc(STN[s.code]||'')+
    '<div class="t">Arr '+(s.arr!=null?fmtM(s.arr):'—')+' · Dep '+(s.dep!=null?fmtM(s.dep):'—')+' · Day '+s.day+'</div></li>'
  ).join('');
  $('schedOut').innerHTML =
    '<div class="card"><h3>'+esc(t[1])+'</h3>'+
    '<p class="sub">'+esc(t[0])+' · '+esc(t[2])+' → '+esc(t[3])+' · '+stops.length+' stops</p>'+
    (runs?'<p class="sub">Runs: '+esc(runs)+'</p>':'')+
    '<p class="sub">Offline timetable</p>'+
    '<ul class="tl">'+route+'</ul></div>';
});

/* ---------- boot ---------- */
(async function(){
  $('dateQ').value = new Date().toISOString().slice(0,10);
  bindTrainSuggest('liveQ','liveSugg');
  bindTrainSuggest('schedQ','schedSugg');
  bindStationSuggest('fromQ','fromSugg');
  bindStationSuggest('toQ','toSugg');
  loadDB();
  try{
    const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 8000);
    const r = await fetch(API+'/health', {signal: ctl.signal}); clearTimeout(to);
    if(r.ok){ $('apiDot').className = 'ok'; $('apiTxt').textContent = 'live data online'; }
    else throw 0;
  }catch(e){ $('apiDot').className = 'bad'; $('apiTxt').textContent = 'live data offline'; }
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
})();
</script>
</body>
</html>
